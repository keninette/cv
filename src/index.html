<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV Delphine Gauthier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Open+Sans:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- background tiles used inside the included components: preloading them
     makes the page wait for them before its load event (when the PDF export prints) -->
    <link rel="preload" as="image" href="assets/checkerboard.svg" />
    <link rel="preload" as="image" href="assets/dots.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="components/header/header.css" />
    <link rel="stylesheet" href="components/experiences/experiences.css" />
    <link rel="stylesheet" href="components/know-me/know-me.css" />
  </head>
  <body>
    <div class="page">
      <div data-include="components/header/header.html"></div>
      <div data-include="components/experiences/experiences-page-1.html"></div>
    </div>

    <div class="page">
      <div data-include="components/experiences/experiences-page-2.html"></div>
      <div data-include="components/know-me/know-me.html"></div>
    </div>

    <!-- Replaces each [data-include] placeholder with the content of its file,
     including the placeholders found inside included files (e.g. the header's picture).
     Needs a local server (e.g. VS Code Live Server): fetch() is blocked on file:// pages. -->
    <script>
      async function include(placeholder) {
        const response = await fetch(placeholder.dataset.include);
        const template = document.createElement("template");
        template.innerHTML = await response.text();
        template.content.querySelectorAll("[data-include]").forEach(include);
        placeholder.replaceWith(template.content);
      }

      document.querySelectorAll("[data-include]").forEach(include);
    </script>
  </body>
</html>
